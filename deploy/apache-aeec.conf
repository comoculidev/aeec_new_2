# ════════════════════════════════════════════════════════════════════════════
#  AEEC — Apache-ni tətbiqə yönəltmək (yalnız canlı server üçün)
#
#  Sayt, idarəetmə paneli və API — hamısını bir tətbiq verir (npm start, port 8080).
#  Apache yalnız HTTPS/domeni qəbul edib hər şeyi bu tətbiqə ötürür. DocumentRoot,
#  .htaccess və s. artıq istifadə olunmur.
#
#  Qoşmaq: aeec.az saytının <VirtualHost ...> blokunun (və ya bloklarının: :80 və :443)
#  içinə, </VirtualHost> sətrindən əvvəl bu bir sətri yazın:
#      Include /opt/aeec/deploy/apache-aeec.conf
#  Sonra:  sudo a2enmod proxy proxy_http headers remoteip setenvif
#          sudo apache2ctl configtest   (→ "Syntax OK")
#          sudo systemctl reload apache2
# ════════════════════════════════════════════════════════════════════════════

# Ziyarətçinin həqiqi IP ünvanı (sayt Cloudflare arxasındadır). Yalnız Cloudflare-in öz
# ünvanlarından gələn başlığa etibar edilir. Siyahı: https://www.cloudflare.com/ips/ (2026-10).
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
RemoteIPTrustedProxy 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

# Bütün sorğular tətbiqə.
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 120
ProxyPass        / http://127.0.0.1:8080/ retry=1
ProxyPassReverse / http://127.0.0.1:8080/

# Tətbiqə ziyarətçinin ünvanı və bağlantının HTTPS olub-olmadığı bildirilir. Ziyarətçinin
# göndərdiyi eyni adlı başlıqlar üzərinə yazılır; X-Forwarded-Proto-ya yalnız sorğu həqiqətən
# Cloudflare-dən gəlibsə etibar edilir (o halda mod_remoteip ünvanı dəyişib).
SetEnvIfExpr "%{HTTPS} == 'on' || (%{HTTP:X-Forwarded-Proto} == 'https' && %{REMOTE_ADDR} != %{CONN_REMOTE_ADDR})" AEEC_HTTPS=1
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "https" env=AEEC_HTTPS
RequestHeader set X-Forwarded-Proto "http" env=!AEEC_HTTPS
